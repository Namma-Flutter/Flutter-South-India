name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* are baked into the static export at build time.
      # Set these as repository Actions variables (see README).
      # Mode defaults to redirect when unset; widget src is required for embed.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_TICKETING_MODE: ${{ vars.NEXT_PUBLIC_TICKETING_MODE || 'redirect' }}
          NEXT_PUBLIC_KONFHUB_EVENT_URL: ${{ vars.NEXT_PUBLIC_KONFHUB_EVENT_URL }}
          NEXT_PUBLIC_KONFHUB_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_KONFHUB_WIDGET_SRC }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
